<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>

<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">

      <nav class="nav" id="nav" aria-label="Sections">

        <a href="#/deadlines" data-view="deadlines">Deadlines</a>
        <a href="#/courses" data-view="courses">Courses</a>
        <a href="#/search" data-view="search">Search</a>

        <a href="#/coverage" data-view="coverage">Coverage</a>
        <a href="#/notes" data-view="notes">Notes &amp; tasks</a>

    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-host" id="toasts" aria-live="polite"></div>
</body>
</html>
