<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Hub</title>
  <script src="/static/theme-init.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e1b16'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23f3efe6' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/appearance.css">
  <link rel="stylesheet" href="/static/light-theme.css">
  <link rel="stylesheet" href="/static/workspace.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Canvas Hub</span>
      </div>
      <div class="account-switch" id="account-switch"></div>
      <nav class="nav" id="nav" aria-label="Sections">
        <div class="nav-label">Workspace</div>
        <a href="#/overview" data-view="overview">Overall</a>
        <details class="nav-group" open><summary>Deadlines &amp; Planner</summary>
          <a href="#/deadlines" data-view="deadlines">Deadlines</a>
          <a href="#/planner" data-view="planner">Planner</a>
        </details>
        <details class="nav-group" open><summary>Courses &amp; Trackers</summary>
          <a href="#/courses" data-view="courses">Courses</a>
          <a href="#/trackers" data-view="trackers">Grade planning &amp; tools</a>
        </details>
        <a href="#/notes" data-view="notes">Notes &amp; tasks</a>
        <a href="#/assistant" data-view="assistant">Assistant</a>
        <div class="nav-label">Find &amp; manage</div>
        <a href="#/search" data-view="search">Search</a>
        <details class="nav-group"><summary>System &amp; data</summary>
          <a href="#/changes" data-view="changes">Changes</a>
          <a href="#/coverage" data-view="coverage">Coverage</a>
          <a href="#/collect" data-view="collect">Collection</a>
          <a href="#/requests" data-view="requests">Agent requests</a>
          <a href="#/settings" data-view="settings">Data &amp; settings</a>
        </details>
      </nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-host" id="toasts" aria-live="polite"></div>
</body>
</html>
